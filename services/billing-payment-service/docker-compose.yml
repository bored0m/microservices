services:
  billing-db:
    image: postgres:15
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_pass
    volumes:
      - billing_db_data:/var/lib/postgresql/data
      # схема применяется один раз при первой инициализации тома
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_user -d billing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-payment-service:
    build: .
    env_file: .env
    environment:
      BILLING_DATABASE_URL: postgresql+psycopg2://billing_user:billing_pass@billing-db:5432/billing_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      billing-db:
        condition: service_healthy
    ports:
      - "8003:8000"

volumes:
  billing_db_data:
